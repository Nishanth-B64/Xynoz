<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xynoz · Real-Time English Practice & AI Coach</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body class="home-page">
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Xynoz Home">
          <div class="brand-icon"><img class="brand-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt=""></div>
          <span>Xynoz</span>
        </a>
        <nav class="nav-links">
          <a class="nav-link active" href="/">Home</a>
          <button type="button" class="theme-toggle">☾ Dark theme</button>
        </nav>
      </header>

      <main>
        <section class="hero-grid">
          <div>
            <div class="eyebrow eyebrow-pill">✦ Live Peer Practice & AI Coach</div>
            <h1>WELCOME TO XYNOZ<br><span class="text-gradient">Speak freely. Connect naturally.</span></h1>
            <div class="hero-actions">
              <a href="/create" class="btn-primary">
                <span>Create a Practice Room</span>
              </a>
              <a href="/join" class="btn-secondary">
                <span>Join with Room Code</span>
              </a>
              <a href="/create?mode=chat" class="btn-secondary">
                <span>Create a P2P Chat Room</span>
              </a>
            </div>
          </div>

        </section>

      </main>
    </div>
  </body>
</html>
